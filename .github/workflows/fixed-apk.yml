# Builds an arm64 APK of this branch that installs alongside the official ProCraft
# (its own app id and name, "ProCraft Fixed"), so the official app and its artwork stay as they are.
name: Fixed APK

on:
  workflow_dispatch:
  push:
    branches: [fixes]

env:
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Its own app id and name
        run: |
          sed -i 's|^        release {$|        release {\n            applicationIdSuffix = ".fixed"|' android/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".fixed"' android/app/build.gradle.kts
          sed -i 's|<string name="app_name">ProCraft</string>|<string name="app_name">ProCraft Fixed</string>|' android/app/src/main/res/values/strings.xml
          grep -q 'ProCraft Fixed' android/app/src/main/res/values/strings.xml

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease -Pprocraft.abis=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: procraft-fixed-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
